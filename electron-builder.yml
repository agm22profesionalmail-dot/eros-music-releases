# F63 · Rebranding interno v1.2.0: appId nuevo. Cambiarlo rompe la
# sustitución in-place automática del NSIS (GUID distinto), pero
# build/installer.nsh (customInit) desinstala por DisplayName cualquier
# versión previa "Metrolist*"/"ERO'*" — cubre el appId viejo
# `com.zero.metrolistpc` y este nuevo, venga del GUID que venga. La
# migración de %APPDATA% la hace la propia app al primer arranque
# (src/main/index.ts).
appId: com.zero.erosmusic
productName: ERO'S Music
# F22: deep-link `erosmusic://` (antes `metrolist://`) para abrir
# playlists/álbumes desde el navegador u otras apps. Registro declarado aquí;
# el handler `open-url` se implementará más adelante (TODO: F22-follow-up).
protocols:
  - name: ERO'S Music
    schemes:
      - erosmusic
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: assets/icon-256.png
    to: icon-256.png
  # Binarios empaquetados para descargas offline sin dependencias externas
  - from: resources/bin/ffmpeg.exe
    to: bin/ffmpeg.exe
  - from: resources/bin/yt-dlp.exe
    to: bin/yt-dlp.exe
asarUnpack:
  - node_modules/jsdom/**
win:
  # F59 · PNG 512: electron-builder genera el .ico multitamaño él solo
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ERO'S Music
  # Sin apóstrofo en el nombre del fichero (más cómodo de compartir)
  artifactName: EROSMusic-Setup-${version}.exe
  deleteAppDataOnUninstall: false
  # F61 · build/installer.nsh (auto-incluido por vivir en buildResources):
  # desinstala en silencio versiones previas (Metrolist/ERO'S, cualquier GUID)
  # y borra setups antiguos de $EXEDIR y Descargas al terminar de instalar.
electronLanguages:
  - es
  - en-US
npmRebuild: false
# F67 · Auto-actualización: los instaladores (+ latest.yml + blockmap) se
# publican como GitHub Releases en un repo aparte SIN código fuente. La app
# empaquetada lee este mismo bloque (app-update.yml generado por
# electron-builder) para saber dónde buscar versiones nuevas.
publish:
  provider: github
  owner: agm22profesionalmail-dot
  repo: eros-music-releases
