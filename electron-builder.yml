appId: com.zero.metrolistpc
productName: Metrolist PC
# F22: deep-link `metrolist://` para abrir playlists/álbumes desde el navegador
# u otras apps. Registro declarado aquí; el handler `open-url` se implementará
# más adelante (TODO: F22-follow-up).
protocols:
  - name: Metrolist
    schemes:
      - metrolist
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: assets/icon-256.png
    to: icon-256.png
  # Binarios empaquetados para descargas offline sin dependencias externas
  - from: resources/bin/ffmpeg.exe
    to: bin/ffmpeg.exe
  - from: resources/bin/yt-dlp.exe
    to: bin/yt-dlp.exe
asarUnpack:
  - node_modules/jsdom/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Metrolist
  artifactName: MetrolistPC-Setup-${version}.exe
  deleteAppDataOnUninstall: false
electronLanguages:
  - es
  - en-US
npmRebuild: false
